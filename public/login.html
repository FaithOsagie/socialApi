<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Nexly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="auth-page">
    <a href="/" class="auth-logo">Nex<span>ly</span></a>

    <div class="auth-card">
      <div class="auth-card-label">Welcome back</div>
      <div class="auth-card-heading">Sign in</div>
      <div class="auth-card-sub">Access your posts, drafts, and feed.</div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="jane@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <div class="form-error" id="err"></div>
      </div>

      <button class="btn btn-primary btn-full" id="submit-btn" onclick="handleLogin()">
        Sign in
      </button>

      <div class="form-result" id="result"></div>

      <div class="auth-switch">
        Don't have an account? <a href="/signup.html">Create one</a>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <svg class="toast-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toast-msg"></span>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
