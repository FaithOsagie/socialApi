<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- ══════════════════════════════════════════════════════
       HORIZONTAL NAV
       [Logo]   [Feed · My Posts]   [Sign in · Join free]
                                 or [Avatar · @user · Sign out]
  ══════════════════════════════════════════════════════════ -->
  <nav class="app-nav">
    <div class="container">
      <div class="app-nav-inner">

        <!-- Left: Logo -->
        <a href="/" class="app-logo">Nex<span>ly</span></a>

        <!-- Center: Tab links -->
        <div class="nav-tabs">
          <button class="nav-tab active" id="tab-public" onclick="switchTab('public')">Feed</button>
          <button class="nav-tab" id="tab-mine" onclick="switchTab('mine')" style="display:none">My posts</button>
        </div>

        <!-- Right: shown when logged in -->
        <div class="nav-right" id="nav-authed" style="display:none">
          <div class="nav-avatar" id="nav-avatar"></div>
          <span class="nav-user-name" id="nav-username"></span>
          <button class="nav-logout-btn" onclick="handleLogout()">Sign out</button>
        </div>

        <!-- Right: shown for guests -->
        <div class="guest-nav-right" id="nav-guest">
          <a href="/login.html" class="nav-link-plain">Sign in</a>
          <a href="/signup.html" class="nav-btn-join">Join free</a>
        </div>

      </div>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════
       GUEST HERO — hidden automatically for logged-in users
  ══════════════════════════════════════════════════════════ -->
  <div class="guest-banner" id="guest-banner">
    <div class="guest-banner-eyebrow">
      <span class="guest-banner-dot"></span>
      Now live
    </div>
    <h1>A place to share<br>what <em>matters most</em></h1>
    <p>Read the latest from our community. Sign up to write, like, and follow the voices you care about.</p>
    <div class="guest-banner-actions">
      <a href="/signup.html" class="btn-banner-primary">Create free account</a>
      <a href="/login.html" class="btn-banner-secondary">Sign in →</a>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       MAIN APP — feed visible to everyone
  ══════════════════════════════════════════════════════════ -->
  <div class="app-body">
    <main class="app-main">

      <div class="feed-header">
        <div class="feed-title" id="feed-title">Public feed</div>
      </div>

      <div class="feed-controls">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input class="search-input" type="text" id="searchInput" placeholder="Search posts, tags…" />
        </div>
        <input class="search-input no-icon" id="authorInput" type="text"
          placeholder="Filter by author…" style="max-width:180px" />
        <select class="sort-select" id="sortSelect">
          <option value="timestamp">Newest first</option>
          <option value="like_count">Most liked</option>
          <option value="comment_count">Most discussed</option>
        </select>
      </div>

      <div id="postsContainer"></div>

      <div class="pagination" id="pagination" style="display:none">
        <span class="page-info" id="pageInfo"></span>
        <div class="page-btns">
          <button class="page-btn" id="prevBtn" onclick="changePage(-1)">← Prev</button>
          <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next →</button>
        </div>
      </div>

    </main>
  </div>

  <!-- ══════════════════════════════════════════════════════
       READ POST MODAL
  ══════════════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="readOverlay" onclick="closeReadModal(event)">
    <div class="modal">
      <div class="modal-header">
        <div id="read-meta" class="post-meta"></div>
        <button class="modal-close" onclick="closeReadDirect()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-post-title" id="read-title"></div>
        <div class="post-tags" id="read-tags" style="margin-bottom:18px"></div>
        <div class="modal-post-content" id="read-content"></div>
      </div>
      <div class="modal-footer">
        <button class="like-btn" id="read-like-btn" onclick="toggleModalLike()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span id="read-likes">0 likes</span>
        </button>
        <span class="modal-date" id="read-date"></span>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       CREATE POST MODAL (JS gates this for auth users only)
  ══════════════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="createOverlay" onclick="closeCreateModal(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-title">New post</div>
        <button class="modal-close" onclick="closeCreateDirect()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="post-title" placeholder="Give your post a title…" />
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea class="post-textarea" id="post-content" placeholder="Write something…"></textarea>
        </div>
        <div class="form-group">
          <label>Tags <span class="label-hint">(comma-separated)</span></label>
          <input type="text" id="post-tags" placeholder="nodejs, backend, api" />
        </div>
        <div class="form-error" id="create-error"></div>
      </div>
      <div class="modal-footer end">
        <button class="btn btn-secondary btn-sm" onclick="submitPost('draft')">Save draft</button>
        <button class="btn btn-primary btn-sm" onclick="submitPost('publish')">Publish</button>
      </div>
    </div>
  </div>

  <!-- Floating create button (auth users only, shown by JS) -->
  <button class="create-fab" id="create-fab" onclick="openCreateModal()"
    title="Write a new post" style="display:none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <!-- Success / error toast -->
  <div class="toast" id="toast">
    <svg class="toast-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toast-msg"></span>
  </div>

  <!-- Auth nudge for guests trying locked actions -->
  <div class="auth-prompt-toast" id="auth-prompt">
    <span id="auth-prompt-msg">Sign in to do that</span>
    <a href="/login.html">Sign in</a>
    <a href="/signup.html" style="color:var(--accent)">Join free</a>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
