<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Nexly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="auth-page">
    <a href="/" class="auth-logo">Nex<span>ly</span></a>

    <div class="auth-card">
      <div class="auth-card-label">New account</div>
      <div class="auth-card-heading">Join Nexly</div>
      <div class="auth-card-sub">Create your account and start writing today.</div>

      <div class="form-row">
        <div class="form-group">
          <label for="first">First name</label>
          <input type="text" id="first" placeholder="Jane" autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label for="last">Last name</label>
          <input type="text" id="last" placeholder="Doe" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group">
        <label for="username">
          Username <span class="label-hint">(min. 4 characters)</span>
        </label>
        <input type="text" id="username" placeholder="janedoe" autocomplete="username" />
        <div class="form-error" id="username-err"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="jane@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">
          Password <span class="label-hint">(min. 6 characters)</span>
        </label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
        <div class="form-error" id="pass-err"></div>
      </div>

      <button class="btn btn-primary btn-full" id="submit-btn" onclick="handleSignup()">
        Create account
      </button>

      <div class="form-result" id="result"></div>

      <div class="auth-switch">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <svg class="toast-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toast-msg"></span>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
